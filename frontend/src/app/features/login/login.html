<div class="login">
  <div class="login-backdrop" aria-hidden="true">
    @for (cat of categories; track cat.slug) {
      <div class="login-backdrop-part" [style.background-image]="'url(' + cat.image + ')'"></div>
    }
  </div>

  <form class="login-card" (ngSubmit)="submit()">
    <img class="logo" src="/favicon.svg" alt="" width="64" height="64" />
    <h1>Usty</h1>
    <p class="muted">Введіть свій пароль</p>

    <div class="password">
      <input
        name="password"
        [type]="showPassword() ? 'text' : 'password'"
        [(ngModel)]="password"
        placeholder="Пароль"
        autocomplete="current-password"
        autofocus
        required
      />
      <button
        type="button"
        class="eye"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Сховати пароль' : 'Показати пароль'"
      >
        {{ showPassword() ? '🙈' : '👁' }}
      </button>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="!password || loading()">
      {{ loading() ? 'Перевіряю…' : 'Увійти' }}
    </button>
  </form>
</div>
