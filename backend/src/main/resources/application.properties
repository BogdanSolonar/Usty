spring.application.name=usty
server.port=8080

# Секрети читаються з backend/secrets.properties, якщо файл існує (він не потрапляє в git).
# Нижче — порожні значення за замовчуванням; справжні лежать у secrets.properties.
spring.config.import=optional:file:./secrets.properties
pixabay.api-key=
jwt.secret=
users.bodya.password=
users.marichka.password=
telegram.bot-token=
# Ім'я бота без @ (для посилань t.me/<ім'я>?start=<код>); порожньо — дізнатися через getMe
telegram.bot-username=
telegram.chat-id=
# Бот слухає /start <код> (видача паролів новим парам). false — вимкнути, напр. для тестового запуску поруч із робочим
telegram.polling-enabled=true

# Скільки живе токен входу
jwt.lifetime-days=7

# Підключення до PostgreSQL, який працює в Docker (див. docker-compose.yml у корені).
# Можна перевизначити змінними оточення DB_URL / DB_USER / DB_PASSWORD (так робить docker-compose).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planning}
spring.datasource.username=${DB_USER:planning}
spring.datasource.password=${DB_PASSWORD:planning}

# Hibernate сам створює/оновлює таблиці за класами @Entity (зручно для навчального проєкту)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Куди складати фото (аватарки, обкладинки, фото з побачень) і обмеження розміру.
# Одне фото — до 10 МБ, один запит (кілька фото разом) — до 100 МБ.
uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Текст помилки (напр. "Такий пароль уже використовується") потрапляє у відповідь — адмінка показує його у формі
spring.web.error.include-message=always
